    <!--
    Redoc doesn't change outer page styles
    -->
    <style>
      body {
        margin: 0;
        padding: 0;
      }
    </style>
    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="/js/script.js"></script>
    <script>
      (window.plausible =
        window.plausible ||
        function () {
          (plausible.q = plausible.q || []).push(arguments);
        }),
        (plausible.init =
          plausible.init ||
          function (i) {
            plausible.o = i || {};
          });
      plausible.init({
        endpoint: "/api/event",
        fileDownloads: {
          fileExtensions: ["yaml", "json"],
        },
      });
    </script>
  </head>
  <body>
    <div id="app"></div>

    <!-- Load Scalar script (to update, get latest from https://cdn.jsdelivr.net/npm/@scalar/api-reference) -->
    <script src="./assets/js/api-reference.js"></script>

    <!-- Initialize Scalar API Reference -->
    <!-- Configuration options https://scalar.com/products/api-references/configuration#properties -->
    <script>
      Scalar.createApiReference("#app", {
        url: "https://raw.githubusercontent.com/AntonPalmqvist/physically-based-api/refs/heads/main/schemas/openapi-schema.yaml",
        expandAllResponses: true,
        hideModels: true,
        telemetry: false,
        withDefaultFonts: false,
        defaultOpenAllTags: true,
        agent: {
          disabled: true,
        },
      });
    </script>
    <link rel="stylesheet" href="./assets/css/custom.css" />
  </body>
